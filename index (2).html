<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>UH UGRD Admissions Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: audience switch (Fall FTIC / Spring Transfers) + sticky tab bar over one working pane. Each tab opens with an insight panel, then interactive charts and tables. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#f0f2f6; --line:#dfe3ea; --ink:#1b2230; --muted:#5d6778;
  --y26:#2459c9; --y26-soft:#e7eefc; --y27:#b50f2b; --y27-soft:#fbe9ec;
  --good:#17803d; --good-soft:#e3f4e9; --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fdf1da; --info:#3b4a63; --info-soft:#e8ecf3;
  --seg1:#3b4a63; --seg2:#6f7f99; --seg3:#a0a9b8; --segtx:#ffffff;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161e; --surface:#1a202b; --surface2:#222a38; --line:#2e3748; --ink:#e8ebf1; --muted:#9aa5b8;
  --y26:#6c9bff; --y26-soft:#1f2c4a; --y27:#ff6b82; --y27-soft:#43202a;
  --good:#4cc47a; --good-soft:#163a26; --bad:#ff8a7d; --bad-soft:#44201c; --warn:#f0b457; --warn-soft:#3d2e12; --info:#b4c0d6; --info-soft:#26303f;
  --seg1:#b4c0d6; --seg2:#7f8ba2; --seg3:#555f73; --segtx:#12161e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161e; --surface:#1a202b; --surface2:#222a38; --line:#2e3748; --ink:#e8ebf1; --muted:#9aa5b8;
  --y26:#6c9bff; --y26-soft:#1f2c4a; --y27:#ff6b82; --y27-soft:#43202a;
  --good:#4cc47a; --good-soft:#163a26; --bad:#ff8a7d; --bad-soft:#44201c; --warn:#f0b457; --warn-soft:#3d2e12; --info:#b4c0d6; --info-soft:#26303f;
  --seg1:#b4c0d6; --seg2:#7f8ba2; --seg3:#555f73; --segtx:#12161e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1080px;margin-inline:auto}
header{padding-block:22px 14px}
h1{font-size:24px;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.hero{position:relative;border-radius:14px;overflow:hidden;min-height:230px;display:flex;align-items:flex-end;background:#2a2f3a}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 68%}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(18,22,30,.86) 0%,rgba(18,22,30,.55) 42%,rgba(18,22,30,0) 78%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;z-index:2;background:#c8102e}
.hero-t{position:relative;z-index:2;padding:28px 26px 24px;max-width:720px}
.hero .eyebrow{color:#ffb3bf}
.hero h1{color:#fff;font-size:28px}
.hero .sub{color:#e6e9ef;max-width:60ch}
@media (max-width:600px){.hero{min-height:190px}.hero-t{padding:22px 18px 20px}.hero h1{font-size:22px}}
.fcr{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.fcr .br{grid-template-columns:122px minmax(0,1fr) 56px}
.fcr .br .yr{font-family:var(--font);font-size:12.5px;color:var(--ink);white-space:nowrap}
@media (max-width:520px){.fcr .br{grid-template-columns:104px minmax(0,1fr) 48px}}
.fcr .track{height:14px;position:relative;overflow:visible}
.fcr .track i{border-radius:3px}
.fcr .track b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.8;z-index:2}
.fcr .dim i{opacity:.4}
.fclegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:12px}
.fclegend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--y26)}
.fclegend span.b::before{background:var(--y27)} .fclegend span.g::before{width:2px;height:12px;border-radius:0;background:var(--ink);vertical-align:-2px}
td.tl{text-align:left;font-family:var(--font)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--y27);margin-bottom:6px}
.sub{color:var(--muted);margin:6px 0 0;max-width:68ch}
.aud{margin-top:14px}
.aud .seg button{font-size:13.5px;padding:8px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--surface)}
.chip i{width:9px;height:9px;border-radius:50%}
.chip.y26 i{background:var(--y26)} .chip.y27 i{background:var(--y27)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;font-weight:500;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink);background:var(--surface2)}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface);border-color:var(--line)}
button:focus-visible,tr[tabindex]:focus-visible,.row[tabindex]:focus-visible{outline:2px solid var(--y26);outline-offset:2px}
main{padding-block:14px 24px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:15px;margin:0;font-weight:600}
.ph{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.ph p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2);flex-wrap:wrap}
.seg button{font:inherit;font-size:12.5px;font-weight:500;border:0;background:transparent;color:var(--muted);padding:6px 12px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.insights{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.insights>h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:600}
.ins-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.ins{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.ins h3{font-size:14px;margin:6px 0 4px;font-weight:600;line-height:1.35}
.ins p{margin:0;color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.k-good{background:var(--good-soft);color:var(--good)} .k-watch{background:var(--warn-soft);color:var(--warn)} .k-ctx{background:var(--info-soft);color:var(--info)}
.row{display:grid;grid-template-columns:170px minmax(0,1fr) 150px;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.panel .row:first-of-type{border-top:0}
.row.sel{background:var(--surface2);margin-inline:-10px;padding-inline:10px;border-radius:8px}
.row[data-sel]{cursor:pointer}
.row[data-sel]:hover .lab{text-decoration:underline}
.lab{font-weight:500;min-width:0}
.lab small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.pb{display:flex;flex-direction:column;gap:4px;min-width:0}
.br{display:grid;grid-template-columns:28px minmax(0,1fr) 64px;gap:8px;align-items:center}
.br .yr{font-family:var(--mono);font-size:11px;color:var(--muted)}
.track{height:10px;background:var(--surface2);border-radius:3px;overflow:hidden}
.row.sel .track{background:var(--line)}
.track i{display:block;height:100%;border-radius:3px;min-width:2px;transition:width .35s ease}
.track i.y26{background:var(--y26)} .track i.y27{background:var(--y27)}
.val{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dcell{text-align:right}
.dl{font-family:var(--mono);font-size:12px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.dl.good{color:var(--good)} .dl.bad{color:var(--bad)} .dl.flat{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);min-width:0}
.tile .t{font-size:12.5px;font-weight:600}
.tile .big{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:6px 0 2px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.big b{font-size:22px;font-weight:600} .big b.a{color:var(--y26)} .big b.b{color:var(--y27)} .big span{color:var(--muted)}
.tile .d{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th button{font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;font-weight:inherit}
th button:hover,th[aria-sort] button{color:var(--ink)}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-family:var(--mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--font);font-weight:500}
tbody tr[data-sel]{cursor:pointer}
tbody tr[data-sel]:hover td,tbody tr.sel td{background:var(--surface2)}
td .v27{color:var(--y27);font-weight:600} td .v26{display:block;color:var(--muted);font-size:11.5px}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.dbox{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.dbox .t{font-size:12px;color:var(--muted)}
.dbox .l{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px;margin-top:4px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.dbox .l b.a{color:var(--y26)} .dbox .l b.b{color:var(--y27)}
.callout{margin:14px 0 0;padding:10px 12px;border-radius:8px;background:var(--surface2);font-size:13px}
.note{color:var(--muted);font-size:12px;margin:12px 0 0}
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--surface2)}
.stack div{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11.5px;color:var(--segtx);min-width:0;overflow:hidden;white-space:nowrap}
.s1{background:var(--seg1)} .s2{background:var(--seg2)} .s3{background:var(--seg3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.two>*{min-width:0}
.pr{display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px 12px;align-items:center;margin-block:10px}
.pr .yrl{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pb.wide .br{grid-template-columns:44px minmax(0,1fr) 64px}
.track i.t-low{background:var(--seg3)} .track i.t-high{background:var(--seg2)}
.mrow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.panel .mrow:first-of-type{border-top:0}
.mrow .lab small{display:block}
.pct-good{color:var(--good)} .pct-mid{color:var(--warn)} .pct-bad{color:var(--bad)}
tr.has-act td{background:var(--surface2)}
tfoot td{font-weight:600;border-bottom:0}
footer{color:var(--muted);font-size:12px;padding-bottom:30px}
@media (max-width:640px){
  .row{grid-template-columns:1fr;gap:6px}
  .row.sel{margin-inline:-8px;padding-inline:8px}
  .dcell{text-align:left}
  .pr{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>

</head>

function dl(a,b,o){
  if(!nn(a)||!nn(b)) return '<span class="dl flat">–</span>';
  o=o||{}; const pol=o.pol===undefined?1:o.pol, kind=o.kind||'count', d=o.d===undefined?1:o.d, diff=b-a;
  const cls=(Math.abs(diff)<1e-9||pol===0)?'flat':((diff>0)===(pol>0)?'good':'bad');
  const ar=diff>1e-9?'▲':diff<-1e-9?'▼':'–'; let tx;
  if(kind==='count') tx=n0(Math.abs(diff))+(a?' ('+Math.abs(diff/a*100).toFixed(1)+'%)':'');
  else if(kind==='pp') tx=Math.abs(diff).toFixed(1)+' pp';
  else if(kind==='days') tx=Math.abs(diff).toFixed(1)+' d';
  else tx=Math.abs(diff).toFixed(d);
  return '<span class="dl '+cls+'">'+ar+' '+tx+'</span>';
}

  const w=v=>(v/mxv*100).toFixed(2);
  const gl='<b style="left:'+w(goal)+'%" title="Goal: '+n0(goal)+'"></b>';
  const row=(lab,cls,v,dim)=>'<div class="br'+(dim?' dim':'')+'" title="'+esc(lab+': '+n0(v))+'"><span class="yr">'+lab+'</span><div class="track"><i class="'+cls+'" style="width:'+w(v)+'%"></i>'+gl+'</div><span class="val">'+n0(v)+'</span></div>';
  const bars='<div class="fcr">'+H.map(h=>row(h.y,'y26',all?h.enrAll:h.enr,false)).join('')+
    ['low','mid','high'].map(k=>row('Fall 2027 '+names[k],'y27',r10(sc[k]),k!==sel)).join('')+'</div>'+
    '<div class="fclegend"><span>Enrolled, prior years</span><span class="b">Fall 2027 forecast</span><span class="g">'+n0(goal)+' enrollment goal</span></div>';
  const mrow=(k,how,v)=>'<tr class="'+(k===sel?'has-act':'')+'"><td>'+(k==='trend'?'Trend check':names[k])+'</td><td class="tl">'+how+'</td><td>'+n0(r10(v*f))+'</td></tr>';
  const meth='<div class="tw"><table style="min-width:560px"><thead><tr><th>Case</th><th style="text-align:left">How it is calculated</th><th>Enrolled</th></tr></thead><tbody>'+
   mrow('low','Fall 2027 applications at 10/4 ('+n0(c.apps)+') × Fall 2026 enrolled per application at 10/4 ('+r26.toFixed(2)+')',low)+
   mrow('mid','Midpoint of the Low and High cases',mid)+
   mrow('high','Fall 2027 applications at 10/4 × average enrolled per application, Fall 2025 and Fall 2026 ('+ravg.toFixed(2)+')',high)+
   mrow('trend','Trend check: Fall 2026 enrolled × average growth of the last two years ('+sp((gr-1)*100)+')'+(trend>high?'. It sits above the High case because it ignores the weaker application pace.':'.'),trend)+
   '</tbody></table></div>';
  const cols=H.concat([c]);
  const tr=(lab,fn,chgFn)=>'<tr><td>'+lab+'</td>'+cols.map((x,i)=>'<td>'+(i===3?'<span class="v27">'+fn(x,i)+'</span>':fn(x,i))+'</td>').join('')+'<td>'+chgFn+'</td></tr>';
  const E=x=>all?x.enrAll:x.enr;
  const cc=v=>'<span class="'+(v>=0?'pct-good':'pct-bad')+'">'+sp(v)+'</span>';
  const ftab='<div class="tw"><table style="min-width:640px"><thead><tr><th>At the cutoff</th>'+cols.map(x=>'<th>'+x.y+'</th>').join('')+'<th>Fall 2027 vs 2026</th></tr></thead><tbody>'+
   tr('Applications',x=>n0(x.apps),cc(pc(c.apps,h26.apps)))+
   tr('Completed files',x=>n0(x.comp),cc(pc(c.comp,h26.comp)))+
   tr('Completed, % of applications',x=>compPct(x).toFixed(1)+'%',cc(compPct(c)-compPct(h26)).replace(/%<\/span>/,' pts</span>'))+
   tr('Admitted',x=>n0(x.adm),cc(pc(c.adm,h26.adm)))+
   tr('Denied',x=>n0(x.den),'<span class="pct-mid">'+sp(pc(c.den,h26.den))+'</span>')+
   tr('Final enrolled',(x,i)=>i===3?'<span title="Forecast">'+n0(val)+'*</span>':n0(E(x)),cc(chg))+
   tr('Enrolled per application at the cutoff',(x,i)=>i===3?(val/(all?f:1)/c.apps).toFixed(2)+'*':(x.enr/x.apps).toFixed(2),'')+
   '</tbody></table></div>';
  return insights(ins)+
  '<section class="panel"><div class="ph"><div><h2>Where Fall 2027 enrollment can land</h2><p>Built from the funnel as of 10/4/2026 (applications) and 10/5/2026 (decisions), compared with the same point in each prior fall.</p></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+seg('fcs',[['low','Low'],['mid','Middle'],['high','High']],sel)+seg('fcb',[['fall','Fall term only'],['all','All admit terms']],S.fcb==='all'?'all':'fall')+'</div></div>'+cards+bars+'</section>'+
  '<section class="panel"><div class="ph"><div><h2>How each case is built</h2><p>All cases start from the same snapshot. They differ in how many applicants are assumed to enroll.</p></div></div>'+meth+'</section>'+
  '<section class="panel"><div class="ph"><div><h2>The funnel at the cutoff, year over year</h2><p>Each column is that fall’s FTIC applicants counted at the same point of the prior year (applications through 10/4, decisions through 10/5). Final enrolled is the full-cycle result.</p></div></div>'+ftab+
  '<p class="note">* Forecast ('+names[sel]+' case). Counts are unduplicated FTIC applicants (EX, FR2, FR3, IF1, IF4) for the fall term only (terms 2240, 2270, 2300, 2330), so Fall 2027 applications are '+n0(c.apps)+' here and '+n0(FTIC.kpi.act.reduce((x,y)=>x+y,0))+' on the KPIs tab, which starts counting on 8/1. “All admit terms” adds students who applied for a spring or summer start and enrolled. With three prior years, the cases are a range, not a prediction. Fall 2024 shows only '+n0(h24.adm)+' admits by 10/5 (decisions appear to have been released later), so admits are not used to build the forecast. Refresh after the 10/31 data to see whether the pace holds.</p></section>';
}

const FCT={
 hist:[
  {y:'Spring 2025',apps:1675,comp:630,adm:339,den:29,fin:4557,enr:1691},
  {y:'Spring 2026',apps:1843,comp:380,adm:500,den:33,fin:4768,enr:1719}],
 cur:{y:'Spring 2027',apps:1861,comp:526,adm:619,den:35},
 goal:2000};
function vForecastTr(){
  const H=FCT.hist, c=FCT.cur, h25=H[0], h26=H[1], goal=FCT.goal;
  const r25=h25.enr/h25.apps, r26=h26.enr/h26.apps, ravg=(r25+r26)/2;
  const low=c.apps*r26, high=c.apps*ravg, mid=(low+high)/2, trend=h26.enr*(h26.enr/h25.enr);
  const sc={low:low,mid:mid,high:high}, r10=v=>Math.round(v/10)*10;
  const names={low:'Low',mid:'Middle',high:'High'};
  const sel=sc[S.fcs]!==undefined?S.fcs:'mid', val=r10(sc[sel]);
  const gap=val-goal, chg=(val/h26.enr-1)*100;
  const pc=(a,b)=>(a/b-1)*100, sp=v=>(v>=0?'+':'−')+Math.abs(v).toFixed(1)+'%';
  const gcl=val/goal>=1?'pct-good':val/goal>=0.97?'pct-mid':'pct-bad';
  const admPct=x=>x.adm/x.apps*100;
  const share26=h26.apps/h26.fin, yld26=h26.enr/h26.fin;
  const finProj=c.apps/share26, needApps=goal/yld26;
  const ins=[
   ['watch','Application growth has slowed','Applications received by 10/4 are '+sp(pc(c.apps,h26.apps))+' ('+n0(c.apps)+' vs '+n0(h26.apps)+'), after '+sp(pc(h26.apps,h25.apps))+' last spring. At the same early share of the cycle as Spring 2026, that points to about '+n0(r10(finProj))+' applications for the full term.'],
   ['good','Decisions are being made sooner','Admits are '+sp(pc(c.adm,h26.adm))+' ('+n0(c.adm)+' vs '+n0(h26.adm)+'). They are '+admPct(c).toFixed(1)+'% of applications, against '+admPct(h26).toFixed(1)+'% last year and '+admPct(h25).toFixed(1)+'% in Spring 2025. Denials are flat ('+n0(c.den)+' vs '+n0(h26.den)+'), so this is speed, not selectivity.'],
   ['watch','Even the High case falls short of '+n0(goal),'The High case is '+n0(r10(high))+' and the Middle case is '+n0(r10(mid))+'. At Spring 2026’s conversion (36.1% of applications enroll), '+n0(goal)+' enrolled needs about '+n0(r10(needApps))+' applications. The current pace projects about '+n0(r10(finProj))+', so roughly '+n0(r10(needApps-finProj))+' more are needed.']
  ];
  const tile=(t,big,cl,sub)=>'<div class="tile"><div class="t">'+t+'</div><div class="big"><b'+(cl?' class="'+cl+'"':'')+'>'+big+'</b></div><div class="d">'+sub+'</div></div>';
  const cards='<div class="tiles">'+
   tile('Forecast, '+names[sel]+' case',n0(val),'','About '+sp(chg)+' vs Spring 2026 ('+n0(h26.enr)+' enrolled)')+
   tile('Likely range',n0(r10(low))+'–'+n0(r10(high)),'','Low case to High case')+
   tile('vs. '+n0(goal)+' goal',(gap>=0?'+':'−')+n0(Math.abs(gap)),gcl,gap>=0?'At or above the goal':n0(-gap)+' more students needed to reach the goal')+'</div>';
  const mxv=Math.max(goal,high)*1.06, w=v=>(v/mxv*100).toFixed(2);
  const gl='<b style="left:'+w(goal)+'%" title="Goal: '+n0(goal)+'"></b>';
  const row=(lab,cls,v,dim)=>'<div class="br'+(dim?' dim':'')+'" title="'+esc(lab+': '+n0(v))+'"><span class="yr">'+lab+'</span><div class="track"><i class="'+cls+'" style="width:'+w(v)+'%"></i>'+gl+'</div><span class="val">'+n0(v)+'</span></div>';
  const bars='<div class="fcr">'+H.map(h=>row(h.y,'y26',h.enr,false)).join('')+
    ['low','mid','high'].map(k=>row('Spring 2027 '+names[k],'y27',r10(sc[k]),k!==sel)).join('')+'</div>'+
    '<div class="fclegend"><span>Enrolled, prior springs</span><span class="b">Spring 2027 forecast</span><span class="g">'+n0(goal)+' enrollment goal</span></div>';
  const mrow=(k,how,v)=>'<tr class="'+(k===sel?'has-act':'')+'"><td>'+names[k]+'</td><td class="tl">'+how+'</td><td>'+n0(r10(v))+'</td></tr>';
  const meth='<div class="tw"><table style="min-width:560px"><thead><tr><th>Case</th><th style="text-align:left">How it is calculated</th><th>Enrolled</th></tr></thead><tbody>'+
   mrow('low','Spring 2027 applications at 10/4 ('+n0(c.apps)+') × Spring 2026 enrolled per application at 10/4 ('+r26.toFixed(2)+')',low)+
   mrow('mid','Midpoint of the Low and High cases',mid)+
   mrow('high','Spring 2027 applications at 10/4 × average enrolled per application, Spring 2025 and Spring 2026 ('+ravg.toFixed(2)+')',high)+
   '</tbody></table></div>';
  const cols=H.concat([c]);
  const tr=(lab,fn,chgFn)=>'<tr><td>'+lab+'</td>'+cols.map((x,i)=>'<td>'+(i===2?'<span class="v27">'+fn(x,i)+'</span>':fn(x,i))+'</td>').join('')+'<td>'+chgFn+'</td></tr>';
  const cc=v=>'<span class="'+(v>=0?'pct-good':'pct-bad')+'">'+sp(v)+'</span>';
  const ftab='<div class="tw"><table style="min-width:600px"><thead><tr><th>At the cutoff</th>'+cols.map(x=>'<th>'+x.y+'</th>').join('')+'<th>Spring 2027 vs 2026</th></tr></thead><tbody>'+
   tr('Applications',x=>n0(x.apps),cc(pc(c.apps,h26.apps)))+
   tr('Completed files',x=>n0(x.comp),cc(pc(c.comp,h26.comp)))+
   tr('Admitted',x=>n0(x.adm),cc(pc(c.adm,h26.adm)))+
   tr('Admitted, % of applications',x=>admPct(x).toFixed(1)+'%',cc(admPct(c)-admPct(h26)).replace(/%<\/span>/,' pts</span>'))+
   tr('Denied',x=>n0(x.den),'<span class="pct-mid">'+sp(pc(c.den,h26.den))+'</span>')+
   tr('Final enrolled',(x,i)=>i===2?'<span title="Forecast">'+n0(val)+'*</span>':n0(x.enr),cc(chg))+
   tr('Enrolled per application at the cutoff',(x,i)=>i===2?(val/c.apps).toFixed(2)+'*':(x.enr/x.apps).toFixed(2),'')+
   '</tbody></table></div>';
  return insights(ins)+
  '<section class="panel"><div class="ph"><div><h2>Where Spring 2027 enrollment can land</h2><p>Built from the transfer funnel as of 10/4/2026 (applications) and 10/5/2026 (decisions), compared with the same point in each prior spring.</p></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'+seg('fcs',[['low','Low'],['mid','Middle'],['high','High']],sel)+'</div></div>'+cards+bars+'</section>'+
  '<section class="panel"><div class="ph"><div><h2>How each case is built</h2><p>All cases start from the same snapshot. They differ in how many applicants are assumed to enroll.</p></div></div>'+meth+
  '<p class="note">Cross-check: growing Spring 2026 enrollment by the one-year change from Spring 2025 ('+sp((h26.enr/h25.enr-1)*100)+') gives about '+n0(r10(trend))+', in line with the Low case.</p></section>'+
  '<section class="panel"><div class="ph"><div><h2>The funnel at the cutoff, year over year</h2><p>Each column is that spring’s transfer applicants counted at the same point of the prior fall (applications through 10/4, decisions through 10/5). Final enrolled is the full-cycle result.</p></div></div>'+ftab+
  '<p class="note">* Forecast ('+names[sel]+' case). Counts are unduplicated transfer applicants (TR2, TR3, IT1, IT4) for a spring start only (terms 2250, 2280, 2310), so Spring 2027 applications are '+n0(c.apps)+' here and '+n0(TRN.O.app[1])+' on the Overview tab, which counts rows. Many transfer students are admitted before their file is marked complete, so completed files are shown for context but not used to build the forecast. Only two prior springs are available, so the cases are a range, not a prediction. Refresh after the 10/31 data to see whether the faster admit pace holds.</p></section>';
}

const V={forecast:vForecast,overview:vOverview,programs:vPrograms,speed:vSpeed,profile:vProfile,denials:vDenials,kpis:vKpi};
function setHash(){try{history.replaceState(null,'','#'+D.hash+S.tab)}catch(_){}}
function render(){
  D=DS[S.aud];
  if(D.tabs.indexOf(S.tab)<0) S.tab='overview';
  const a=document.activeElement; let key=null;
  if(a&&a.dataset){
    if(a.dataset.set) key='[data-set="'+a.dataset.set+'"][data-v="'+a.dataset.v+'"]';
    else if(a.dataset.tk) key='[data-tk="'+a.dataset.tk+'"]';
    else if(a.dataset.sel) key='[data-sel="'+a.dataset.sel+'"]';
    else if(a.dataset.tab) key='[data-tab="'+a.dataset.tab+'"]';
  }
  if(!key&&a&&a.id==='goal') key='#goal';
  document.getElementById('h1').textContent=D.h1;
  document.getElementById('sub').textContent=D.sub;
  document.getElementById('aud').innerHTML=seg('aud',[['ftic','Fall FTIC'],['tr','Spring Transfers']],S.aud);
  document.getElementById('chips').innerHTML=D.chips.map(c=>'<span class="chip '+c[0]+'"><i></i>'+c[1]+'</span>').join('');
  document.getElementById('foot').textContent=D.foot;
  document.getElementById('tabs').innerHTML=TABS.filter(t=>D.tabs.indexOf(t[0])>=0).map(t=>'<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>').join('');
  document.getElementById('view').innerHTML=V[S.tab]();
  if(key){const el=document.querySelector(key); if(el) el.focus({preventScroll:true});}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'),s=e.target.closest('[data-set]'),k=e.target.closest('[data-tk]'),r=e.target.closest('[data-sel]');
  if(t){S.tab=t.dataset.tab;setHash();render();window.scrollTo({top:0})}
  else if(s){
    if(s.dataset.set==='aud'){S.aud=s.dataset.v;S.sel=DS[S.aud].defSel;D=DS[S.aud];setHash();}
    else S[s.dataset.set]=s.dataset.v;
    render();
  }
  else if(k){const v=k.dataset.tk;if(S.tk===v)S.td*=-1;else{S.tk=v;S.td=(v==='days')?1:-1}render()}
  else if(r){S.sel=r.dataset.sel;render()}
});
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='goal'){S.goal=Math.min(9999,Math.max(100,parseInt(e.target.value,10)||2000));render();}
});
document.addEventListener('keydown',e=>{
  const r=e.target.closest&&e.target.closest('[data-sel]');
  if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.sel=r.dataset.sel;render()}
});
(function(){
  let h=(location.hash||'').slice(1);
  if(h.indexOf('tr-')===0){S.aud='tr';S.sel=TRN.defSel;h=h.slice(3)}
  if(V[h])S.tab=h;
  render();
})();
</script>
