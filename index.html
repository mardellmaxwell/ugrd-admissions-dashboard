,"tden":7.840192249924903,"ins":[["good","Houston-area markets are carrying Texas growth","Texas applications by 10/7 rose from 7,988 to 8,357 (+369, +4.6%). The four Houston-area markets added +303 (+7.4%), led by Northwest Houston and Conroe (+147) and Southwest Houston (+88). City of Houston (East) and Galveston and East Harris are flat. Outside Texas, applications fell from 1,085 to 976. 13 markets are up, 10 are down and 1 is flat."],["watch","Five larger markets are down by 10 or more applications","San Antonio (\u221248), Del Rio, Uvalde and Bexar County (\u221232), City of Dallas (\u22122), City of Fort Worth (\u22122) and East Texas (\u22121) are the larger markets that slipped. At last year's yield each is worth only 1 to 3 enrollments, so the case for outreach is about trend and recruiting reach, not volume. The Fort Worth decline appears only when estimated tags are included."],["good","Decisions are faster across Texas","The typical wait from completed file to admit decision fell from 5 days to 2, and apply to completed file shortened from 12 to 11 days. Of 19 markets with at least 8 timed admits in both years, 18 got faster, 0 stayed the same and 1 got slower. Slowest now: Irving / Arlington / GP (5 d, 25 admits), Waco / Temple / Killeen (3 d, 47 admits), Brazos / Trinity Valley (3 d, 45 admits)."],["watch","City of Houston (East) needs completion outreach first","Applications are flat at 851, but completed files fell from 165 to 130. The completion rate dropped from 20.7% to 15.3%, against 39.8% for Texas. Matching last year's rate means about 46 more completed files. It also added 11 denials. Dallas (city) (22.3%) and South Texas Valley (26.3%) also sit well below the Texas rate, although both improved from under 10%."],["watch","Four markets hold 61% of the rise in denials","Texas denials grew from 108 to 261 (+153). NW Houston / Conroe (+36), SW Houston Metro (+27), Central Gulf Coast (+19), Collin / Rockwall (+12) account for 94 of them. Denials reached 7.8% of completed files for Texas; Fort Worth, city (16.9%) and West of DFW (11.3%) run highest among markets with 10 or more denials."],["ctx","How to read the market tags","87% of Fall 2027 Texas applications are tagged straight from the geo market database; the rest are estimated from nearby school zips, so the Houston-area markets (about 61% accurate when estimated) are directional. Counts here use the same cohort as the Overview tab, so Texas plus outside Texas equals the Overview total."]],"hs":{"TX01":{"rows":[{"id":"226579","n":"Frenship High School","city":"Wolfforth","a":[3,4],"c":[0,1],"ad":[0,0],"d":[0,0]},{"id":"225731","n":"Coronado High School","city":"Lubbock","a":[2,4],"c":[1,1],"ad":[1,1],"d":[0,0]},{"id":"224344","n":"Randall High School","city":"Amarillo","a":[0,2],"c":[0,1],"ad":[0,0],"d":[0,1]},{"id":"224332","n":"Amarillo High School","city":"Amarillo","a":[1,1],"c":[0,1],"ad":[0,1],"d":[0,0]},{"id":"224673","n":"Clarendon High School","city":"Clarendon","a":[0,1],"c":[0,1],"ad":[0,0],"d":[0,0]},{"id":"225742","n":"Lubbock High School","city":"Lubbock","a":[0,1],"c":[0,0],"ad":[0,0],"d":[0,0]},{"id":"225924","n":"O'donnell High School","city":"Odonnell","a":[0,1],"c":[0,1],"ad":[0,1],"d":[0,0]},{"id":"225982","n":"Petersburg High School","city":"Petersburg","a":[0,1],"c":[0,0],"ad":[0,0],"d":[0,0]},{"id":"226436","n":"Tulia High School","city":"Tulia","a":[0,1],"c":[0,1],"ad":[0,0],"d":[0,0]},{"id":"440067","n":"Midway Alternative High School","city":"Amarillo","a":[0,1],"c":[0,0],"ad":[0,0],"d":[0,0]},{"id":"440122","n":"Ascension Academy","city":"Amarillo","a":[0,1],"c":[0,0],"ad":[0,0],"d":[0,0]},{"id":"440706","n":"West Plains High School","city":"Amarillo","a":[0,1],"c":[0,0],"ad":[0,0],"d":[0,0]},{"id":"444374","n":"Margaret Talkington School YWL","city":"Lubbock","a":[0,1],"c":[0,1],"ad":[0,1],"d":[0,0]},{"id":"224348","n":"Tascosa High School","city":"Amarillo","a":[3,0],"c":[2,0],"ad":[2,0],"d":[0,0]},{"id":"225730","n":"Cooper function sortedP(){

, 1026, 1053, 1086, 1119, 1137, 1151, 1180, 1214, 1243, 1281, 1302, 1316, 1332, 1360, 1389, 1425, 1444, 1479, 1496, 1510, 1549, 1588, 1618, 1649, 1675, 1690, 1721, 1750, 1783, 1829, 1860, 1895, 1923, 1951, 1998, 2050, 2084, 2124, 2157, 2178, 2199, 2240, 2271, 2309, 2342, 2375, 2392, 2421, 2459, 2506, 2560, 2609], [233, 253, 271, 307, 323, 374, 400, 435, 443, 460, 483, 521, 545, 569, 592, 603, 614, 644, 678, 711, 743, 764, 787, 803, 828, 861, 914, 943, 967, 978, 995, 1023, 1057, 1082, 1105, 1125, 1138, 1154, 1191, 1220, 1249, 1274, 1294, 1310, 1330, 1360, 1397, 1415, 1443, 1460, 1473, 1486, 1521, 1553, 1586, 1606, 1628, 1639, 1656, 1689, 1728, 1767, 1792, 1832, 1843, 1854, 1895, 1930, 1963, 1989, 2015, 2036, 2056, 2115, 2277, 2431, 2554, 2665, 2764, 2867, 2916, 2957, 2991, 3018, 3038, 3065, 3093, 3131, 3160, 3180, 3226, 3246], [254, 281, 344, 376, 400, 445, 471, 495, 513, 540, 574, 606, 652, 673, 690, 708, 753, 793, 824, 851, 881, 899, 915, 945, 968, 998, 1024, 1037, 1047, 1061, 1095, 1125, 1153, 1177, 1192, 1203, 1223, 1251, 1277, 1330, 1347, 1361, 1376, 1398, 1426, 1456, 1478, 1497, 1521, 1533, 1550, 1579, 1603, 1633, 1648, 1662, 1678, 1692, 1727, 1750, 1776, 1808, 1834, 1850, 1871, 1900, 1928, 1950, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null, null]], "cut": 67}};

const sp=v=>(v>=0?"+":"\u2212")+Math.abs(v).toFixed(1)+"%";

function fcPace(){
  const tr=D.key==='tr', p=PACE[tr?'tr':'ftic'], full=S.fpz==='full', N=full?92:p.cut+1, W=720,H=300,L=52,R=16,T=16,B=34;
  const cols=['#a9b0bb','var(--y26)','var(--y27)'], dash=['5 4','',''];
  let mxv=0; p.s.forEach(a=>a.forEach((v,i)=>{if(v!=null&&i<N&&v>mxv)mxv=v}));
  const step=mxv>12000?5000:mxv>4000?1000:500, top=Math.ceil(mxv*1.05/step)*step;
  const X=i=>L+(W-L-R)*i/(N-1), Y=v=>T+(H-T-B)*(1-v/top);
  let g='';
  for(let v=0;v<=top;v+=step) g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" class="gl"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" class="ax">'+n0(v)+'</text>';
  const mons=[[0,'Aug 1'],[31,'Sep 1'],[61,'Oct 1'],[92,'Nov 1']];
  mons.forEach(m=>{if(m[0]<N) g+='<text x="'+X(m[0])+'" y="'+(H-12)+'" text-anchor="'+(m[0]===0?'start':'middle')+'" class="ax">'+m[1]+'</text>'});
  const lines=p.s.map((a,k)=>{let d='';a.forEach((v,i)=>{if(v!=null&&i<N)d+=(d?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)});return '<path d="'+d+'" fill="none" stroke="'+cols[k]+'" stroke-width="'+(k===2?3:2.2)+'"'+(dash[k]?' stroke-dasharray="'+dash[k]+'"':'')+' stroke-linejoin="round"/>'}).join('');
  const c=p.cut, cx=X(c);
  let cut='<line x1="'+cx+'" x2="'+cx+'" y1="'+T+'" y2="'+(H-B)+'" class="cutl"/><text x="'+(full?cx+6:cx-6)+'" y="'+(T+10)+'" text-anchor="'+(full?'start':'end')+'" class="ax b">Report cutoff 10/8</text>';
  const dots=p.s.map((a,k)=>a[c]!=null?'<circle cx="'+cx+'" cy="'+Y(a[c])+'" r="4.5" fill="'+cols[k]+'"/>':'').join('');
  const svg='<svg viewBox="0 0 '+W+' '+H+'" class="pace" role="img" aria-label="Cumulative applications by day, three years">'+g+cut+lines+dots+'</svg>';
  const v=p.s.map(a=>a[c]);
  const leg=p.labels.map((l,k)=>'<span><i style="background:'+cols[k]+(k===0?';opacity:.8':'')+'"></i>'+l+(a=>' <b>'+n0(a)+'</b>')(v[k])+'</span>').join('');
  const d26=pcx(v[2],v[1]), d25=pcx(v[2],v[0]);
  const note='At the cutoff, '+p.labels[2]+' is '+(Math.abs(d26)<0.05?'level with':n0(Math.abs(v[2]-v[1]))+' '+(d26>=0?'ahead of':'behind'))+' '+p.labels[1]+' ('+sp(d26)+')'+(full&&p.s[1][91]!=null?'. Last year added '+n0(p.s[1][91]-v[1])+' more applications between 10/7 and 10/31 ('+sp(pcx(p.s[1][91],v[1]))+'), which is the stretch this year has yet to show.':'.');
  return '<section class="panel"><div class="ph"><div><h2>Application pace</h2><p>Cumulative unique applications from August 1. '+(full?'Prior years run through October 31.':'All three years shown to the same cutoff.')+'</p></div>'+seg('fpz',[['cut','Through 10/8'],['full','Through 10/31']],S.fpz)+'</div>'+
   '<div class="fclegend pl">'+leg+'</div>'+svg+'<p class="fnote">'+note+'</p></section>';
}
function fcYield(){
  const tr=D.key==='tr', hist=(tr?FCT:FC).hist, c=(tr?FCT:FC).cur, goal=(tr?FCT:FC).goal;
  const ys=hist.map(h=>h.enr/h.apps); let r26=ys[ys.length-1], ravg=tr?(ys[0]+ys[1])/2:(ys[1]+ys[2])/2;
  if(!tr&&S.fyb==='adj'&&typeof YD!=='undefined'){r26=YD.adj[0]/c.apps;ravg=YD.adj[1]/c.apps}
  const lowY=r26, highY=ravg, midY=(lowY+highY)/2, need=goal/c.apps;
  const rows=hist.map((h,i)=>({l:h.y,v:ys[i],k:'h'}));
  rows.push({l:c.y+' forecast',lo:Math.min(lowY,highY),hi:Math.max(lowY,highY),mid:midY,k:'f'});
  const all=ys.concat([lowY,highY,need]), mn=Math.floor(Math.min.apply(null,all)*20-1)/20, mxv=Math.ceil(Math.max.apply(null,all)*20+1)/20;
  const W=720,H=290,L=52,R=16,T=18,B=48, n=rows.length;
  const X=i=>L+(W-L-R)*(i+.5)/n, Y=v=>T+(H-T-B)*(1-(v-mn)/(mxv-mn));
  let g='';
  for(let v=mn;v<=mxv+1e-9;v+=.05) g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" class="gl"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" class="ax">'+v.toFixed(2)+'</text>';
  const nd='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(need)+'" y2="'+Y(need)+'" class="needl"/><text x="'+(L+8)+'" y="'+(Y(need)-6)+'" text-anchor="start" class="ax b">Needed for '+n0(goal)+': '+need.toFixed(2)+'</text>';
  let path='';
  rows.forEach((r,i)=>{if(r.k==='h') path+=(path?'L':'M')+X(i)+','+Y(r.v)});
  const last=rows.length-2; const pl='<path d="'+path+'" fill="none" stroke="var(--y26)" stroke-width="2.4"/>';
  let marks='';
  rows.forEach((r,i)=>{
    const x=X(i);
    if(r.k==='h') marks+='<circle cx="'+x+'" cy="'+Y(r.v)+'" r="5" fill="var(--y26)"/><text x="'+x+'" y="'+(Y(r.v)-10)+'" text-anchor="middle" class="ax b">'+r.v.toFixed(2)+'</text>';
    else marks+='<rect x="'+(x-22)+'" y="'+Y(r.hi)+'" width="44" height="'+Math.max(2,Y(r.lo)-Y(r.hi))+'" rx="4" fill="var(--y27)" opacity=".85"/><circle cx="'+x+'" cy="'+Y(r.mid)+'" r="5.5" fill="#fff" stroke="var(--y27t)" stroke-width="2.5"/><text x="'+(x+30)+'" y="'+(Y(r.hi)-6)+'" class="ax">High '+r.hi.toFixed(2)+'</text><text x="'+(x+30)+'" y="'+(Y(r.lo)+16)+'" class="ax">Low '+r.lo.toFixed(2)+'</text>';
    marks+='<text x="'+x+'" y="'+(H-24)+'" text-anchor="middle" class="ax">'+r.l.replace(' forecast','')+'</text>'+(r.k==='f'?'<text x="'+x+'" y="'+(H-9)+'" text-anchor="middle" class="ax">forecast range</text>':'');
  });
  const gap=need-highY, ok=need<=highY, within=need<=highY+1e-9?'inside':need>=lowY&&need<=highY?'inside':'above';
  const msg=need<=lowY?'The goal needs '+need.toFixed(2)+' enrolled per application, which even the Low case clears.':ok?'The goal needs '+need.toFixed(2)+' enrolled per application, between the Low ('+lowY.toFixed(2)+') and High ('+highY.toFixed(2)+') cases.':'The goal needs '+need.toFixed(2)+' enrolled per application, above even the High case ('+highY.toFixed(2)+'), so it requires a better yield than either prior year delivered.';
  return '<section class="panel"><div class="ph"><div><h2>What the goal requires</h2><p>Final enrolled per application received by the cutoff. The dashed line is the yield needed to reach '+n0(goal)+' from '+n0(c.apps)+' applications.</p></div></div>'+
   '<svg viewBox="0 0 '+W+' '+H+'" class="pace" role="img" aria-label="Enrolled per application, history and forecast">'+g+nd+pl+marks+'</svg><p class="fnote">'+msg+'</p></section>';
}
(function(){
  const o=V.forecast, M='<section class="panel"><div class="ph"><div><h2>How each case is built';
  V.forecast=function(){const h=o(), i=h.indexOf(M); return i<0?h:h.slice(0,i)+fcPace()+fcYield()+(typeof fcYAware==='function'?fcYAware():'')+h.slice(i)};
