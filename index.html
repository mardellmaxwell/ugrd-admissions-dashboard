<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>UH UGRD Admissions Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: audience switch (Fall FTIC / Spring Transfers) + sticky tab bar over one working pane. Each tab opens with an insight panel, then interactive charts and tables. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#f0f2f6; --line:#dfe3ea; --ink:#1b2230; --muted:#5d6778;
  --y26:#2459c9; --y26-soft:#e7eefc; --y27:#b50f2b; --y27-soft:#fbe9ec;
  --good:#17803d; --good-soft:#e3f4e9; --bad:#b42318; --bad-soft:#fde8e6; --warn:#9a5b00; --warn-soft:#fdf1da; --info:#3b4a63; --info-soft:#e8ecf3;
  --seg1:#3b4a63; --seg2:#6f7f99; --seg3:#a0a9b8; --segtx:#ffffff;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161e; --surface:#1a202b; --surface2:#222a38; --line:#2e3748; --ink:#e8ebf1; --muted:#9aa5b8;
  --y26:#6c9bff; --y26-soft:#1f2c4a; --y27:#ff6b82; --y27-soft:#43202a;
  --good:#4cc47a; --good-soft:#163a26; --bad:#ff8a7d; --bad-soft:#44201c; --warn:#f0b457; --warn-soft:#3d2e12; --info:#b4c0d6; --info-soft:#26303f;
  --seg1:#b4c0d6; --seg2:#7f8ba2; --seg3:#555f73; --segtx:#12161e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161e; --surface:#1a202b; --surface2:#222a38; --line:#2e3748; --ink:#e8ebf1; --muted:#9aa5b8;
  --y26:#6c9bff; --y26-soft:#1f2c4a; --y27:#ff6b82; --y27-soft:#43202a;
  --good:#4cc47a; --good-soft:#163a26; --bad:#ff8a7d; --bad-soft:#44201c; --warn:#f0b457; --warn-soft:#3d2e12; --info:#b4c0d6; --info-soft:#26303f;
  --seg1:#b4c0d6; --seg2:#7f8ba2; --seg3:#555f73; --segtx:#12161e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px}
.wrap{max-width:1080px;margin-inline:auto}
header{padding-block:22px 14px}
h1{font-size:24px;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--y27);margin-bottom:6px}
.sub{color:var(--muted);margin:6px 0 0;max-width:68ch}
.aud{margin-top:14px}
.aud .seg button{font-size:13.5px;padding:8px 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--surface)}
.chip i{width:9px;height:9px;border-radius:50%}
.chip.y26 i{background:var(--y26)} .chip.y27 i{background:var(--y27)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;font-weight:500;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink);background:var(--surface2)}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface);border-color:var(--line)}
button:focus-visible,tr[tabindex]:focus-visible,.row[tabindex]:focus-visible{outline:2px solid var(--y26);outline-offset:2px}
main{padding-block:14px 24px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:15px;margin:0;font-weight:600}
.ph{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.ph p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2);flex-wrap:wrap}
.seg button{font:inherit;font-size:12.5px;font-weight:500;border:0;background:transparent;color:var(--muted);padding:6px 12px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.insights{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.insights>h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 12px;font-weight:600}
.ins-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.ins{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.ins h3{font-size:14px;margin:6px 0 4px;font-weight:600;line-height:1.35}
.ins p{margin:0;color:var(--muted);font-size:13px}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.k-good{background:var(--good-soft);color:var(--good)} .k-watch{background:var(--warn-soft);color:var(--warn)} .k-ctx{background:var(--info-soft);color:var(--info)}
.row{display:grid;grid-template-columns:170px minmax(0,1fr) 150px;gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.panel .row:first-of-type{border-top:0}
.row.sel{background:var(--surface2);margin-inline:-10px;padding-inline:10px;border-radius:8px}
.row[data-sel]{cursor:pointer}
.row[data-sel]:hover .lab{text-decoration:underline}
.lab{font-weight:500;min-width:0}
.lab small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.pb{display:flex;flex-direction:column;gap:4px;min-width:0}
.br{display:grid;grid-template-columns:28px minmax(0,1fr) 64px;gap:8px;align-items:center}
.br .yr{font-family:var(--mono);font-size:11px;color:var(--muted)}
.track{height:10px;background:var(--surface2);border-radius:3px;overflow:hidden}
.row.sel .track{background:var(--line)}
.track i{display:block;height:100%;border-radius:3px;min-width:2px;transition:width .35s ease}
.track i.y26{background:var(--y26)} .track i.y27{background:var(--y27)}
.val{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dcell{text-align:right}
.dl{font-family:var(--mono);font-size:12px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.dl.good{color:var(--good)} .dl.bad{color:var(--bad)} .dl.flat{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);min-width:0}
.tile .t{font-size:12.5px;font-weight:600}
.tile .big{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:6px 0 2px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.big b{font-size:22px;font-weight:600} .big b.a{color:var(--y26)} .big b.b{color:var(--y27)} .big span{color:var(--muted)}
.tile .d{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th button{font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;font-weight:inherit}
th button:hover,th[aria-sort] button{color:var(--ink)}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-family:var(--mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--font);font-weight:500}
tbody tr[data-sel]{cursor:pointer}
tbody tr[data-sel]:hover td,tbody tr.sel td{background:var(--surface2)}
td .v27{color:var(--y27);font-weight:600} td .v26{display:block;color:var(--muted);font-size:11.5px}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.dbox{border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.dbox .t{font-size:12px;color:var(--muted)}
.dbox .l{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 8px;margin-top:4px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.dbox .l b.a{color:var(--y26)} .dbox .l b.b{color:var(--y27)}
.callout{margin:14px 0 0;padding:10px 12px;border-radius:8px;background:var(--surface2);font-size:13px}
.note{color:var(--muted);font-size:12px;margin:12px 0 0}
.stack{display:flex;height:26px;border-radius:6px;overflow:hidden;background:var(--surface2)}
.stack div{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11.5px;color:var(--segtx);min-width:0;overflow:hidden;white-space:nowrap}
.s1{background:var(--seg1)} .s2{background:var(--seg2)} .s3{background:var(--seg3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.two>*{min-width:0}
.pr{display:grid;grid-template-columns:100px minmax(0,1fr);gap:8px 12px;align-items:center;margin-block:10px}
.pr .yrl{font-family:var(--mono);font-size:12px;color:var(--muted)}
.pb.wide .br{grid-template-columns:44px minmax(0,1fr) 64px}
.track i.t-low{background:var(--seg3)} .track i.t-high{background:var(--seg2)}
.mrow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:6px 14px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.panel .mrow:first-of-type{border-top:0}
.mrow .lab small{display:block}
.pct-good{color:var(--good)} .pct-mid{color:var(--warn)} .pct-bad{color:var(--bad)}
tr.has-act td{background:var(--surface2)}
tfoot td{font-weight:600;border-bottom:0}
footer{color:var(--muted);font-size:12px;padding-bottom:30px}
@media (max-width:640px){
  .row{grid-template-columns:1fr;gap:6px}
  .row.sel{margin-inline:-8px;padding-inline:8px}
  .dcell{text-align:left}
  .pr{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>

</head>

function dl(a,b,o){
  if(!nn(a)||!nn(b)) return '<span class="dl flat">–</span>';
  o=o||{}; const pol=o.pol===undefined?1:o.pol, kind=o.kind||'count', d=o.d===undefined?1:o.d, diff=b-a;
  const cls=(Math.abs(diff)<1e-9||pol===0)?'flat':((diff>0)===(pol>0)?'good':'bad');
  const ar=diff>1e-9?'▲':diff<-1e-9?'▼':'–'; let tx;
  if(kind==='count') tx=n0(Math.abs(diff))+(a?' ('+Math.abs(diff/a*100).toFixed(1)+'%)':'');
  else if(kind==='pp') tx=Math.abs(diff).toFixed(1)+' pp';
  else if(kind==='days') tx=Math.abs(diff).toFixed(1)+' d';
  else tx=Math.abs(diff).toFixed(d);
  return '<span class="dl '+cls+'">'+ar+' '+tx+'</span>';
}

  '<section class="panel"><div class="ph"><div><h2>Denials at a glance</h2></div></div><div class="tiles">'+
   '<div class="tile"><div class="t">Denied</div><div class="big"><b class="a">'+O.den[0]+'</b><span>→</span><b class="b">'+O.den[1]+'</b></div><div class="d">'+dl(O.den[0],O.den[1],{pol:0})+'</div></div>'+
   '<div class="tile"><div class="t">'+D.denShareTitle+'</div><div class="big"><b class="a">'+sh[0].toFixed(1)+'%</b><span>→</span><b class="b">'+sh[1].toFixed(1)+'%</b></div><div class="d">'+dl(sh[0],sh[1],{pol:0,kind:'pp'})+'</div></div>'+
   '<div class="tile"><div class="t">Mean GPA of denied</div><div class="big"><b class="a">'+mg[0].toFixed(2)+'</b><span>→</span><b class="b">'+mg[1].toFixed(2)+'</b></div><div class="d">'+dl(mg[0],mg[1],{pol:0,kind:'num',d:2})+'</div></div></div></section>'+
  '<div class="two"><section class="panel"><div class="ph"><div><h2>'+D.denGpaTitle+'</h2><p>Students per band.</p></div></div>'+gb+'</section>'+
  '<section class="panel"><div class="ph"><div><h2>Residency of denied</h2></div></div>'+rs+'</section></div>'+
  '<section class="panel"><div class="ph"><div><h2>Denials by program</h2><p>Programs with at least one denial.</p></div></div>'+ps+'<p class="note">'+D.dnote+'</p></section>';
}

function vKpiTr(){
  const K=D.tk, H=K.hist, sum=a=>a.reduce((x,y)=>x+y,0);
  const goal=Math.max(100,parseInt(S.goal,10)||2000);
  const keys=S.tbasis==='both'?['sp25','sp26']:[S.tbasis], nY=keys.length;
  const bl=S.tbasis==='both'?'Spring 2025 and 2026':H[S.tbasis].label;
  const agg=f=>sum(keys.map(k=>H[k][f]));
  const apps=agg('apps'), comp=agg('comp'), adm=agg('adm'), enr=agg('enr');
  const mon=K.months.map((_,i)=>sum(keys.map(k=>H[k].monthly[i])));
  const rAdm=adm/apps, rYield=enr/adm, rEnr=enr/apps, rComp=comp/apps;
  const need={apps:goal/rEnr}; need.adm=goal/rYield; need.comp=need.apps*rComp; need.enr=goal;
  const hist={apps:apps/nY,comp:comp/nY,adm:adm/nY,enr:enr/nY};
  const share=mon.map(v=>v/apps), target=share.map(s=>Math.round(need.apps*s));
  const n=K.act.length, ytd=sum(K.act), cum=sum(share.slice(0,n)), tYtd=Math.round(need.apps*cum);
  const proj=ytd/cum, projEnr=proj*rEnr, pc=ytd/tYtd*100, pe=projEnr/goal*100;
  const cls=p=>p>=100?'pct-good':p>=97?'pct-mid':'pct-bad';
  const sg=v=>(v>=0?'+':'−')+n0(Math.abs(v)), p1=v=>(v*100).toFixed(1)+'%';
  const more=(need.apps/hist.apps-1)*100;
  const ins=[
   [more>0?'watch':'good','Reaching '+n0(goal)+' enrollments takes about '+n0(need.apps)+' applications','At '+bl+' conversion, '+p1(rAdm)+' of applications are admitted and '+p1(rYield)+' of admits enroll, so '+p1(rEnr)+' of applications become enrollments. '+bl+' brought '+n0(hist.apps)+' applications'+(S.tbasis==='both'?' a year':'')+', so the goal needs '+(more>=0?Math.abs(more).toFixed(1)+'% more':Math.abs(more).toFixed(1)+'% fewer')+'.'],
   [pc>=100?'good':'watch','Applications are '+(pc>=100?'on or ahead of':'behind')+' goal pace','Through 9/30, '+n0(ytd)+' applications are in. The goal pace calls for '+n0(tYtd)+' by now, so Spring 2027 is at '+pc.toFixed(1)+'% of pace ('+sg(ytd-tYtd)+').'],
   [pe>=100?'good':'watch','At the historical pattern, Spring 2027 finishes near '+n0(projEnr)+' enrolled','If applications keep the same monthly shape, the term ends near '+n0(proj)+' applications. That is '+n0(Math.abs(goal-projEnr))+(projEnr<goal?' short of':' above')+' the goal and about '+n0(Math.max(0,need.apps-proj))+' applications short of what the goal needs.'],
   ['ctx','October and November decide the term','They bring '+p1((mon[3]+mon[4])/apps)+' of a spring transfer class. Conversion has been steady: '+p1(H.sp25.enr/H.sp25.apps)+' of applications enrolled in Spring 2025 and '+p1(H.sp26.enr/H.sp26.apps)+' in Spring 2026.']
  ];
  const tile=(t,big,c,sub)=>'<div class="tile"><div class="t">'+t+'</div><div class="big"><b class="'+c+'">'+big+'</b></div><div class="d">'+sub+'</div></div>';
  const cards='<div class="tiles">'+
   '<div class="tile"><div class="t">Applications through 9/30</div><div class="big"><b>'+n0(ytd)+'</b></div><div class="d">'+K.months.slice(0,n).map((m,i)=>m+' '+n0(K.act[i])).join(' · ')+'</div></div>'+
   tile('vs. goal pace ('+n0(Math.round(need.apps))+' total)',pc.toFixed(1)+'%',cls(pc),'YTD target: '+n0(tYtd)+' · Gap: '+sg(ytd-tYtd))+
   tile('Projected enrollment (goal '+n0(goal)+')',n0(projEnr),cls(pe),pe.toFixed(1)+'% of goal · Gap: '+sg(projEnr-goal))+'</div>';
  const stages=[['Applications','apps',p1(rAdm)+' admitted'],['Completed file','comp',p1(rComp)+' of applications'],['Admitted','adm',p1(rYield)+' enroll'],['Enrolled','enr',p1(rEnr)+' of applications']];
  const smax=Math.max(...stages.map(s=>Math.max(hist[s[1]],need[s[1]])));
  const sbar=(lab,c,v,tip)=>'<div class="br" title="'+esc(tip)+'"><span class="yr">'+lab+'</span><div class="track"><i class="'+c+'" style="width:'+(v/smax*100).toFixed(2)+'%"></i></div><span class="val">'+n0(v)+'</span></div>';
  const frows=stages.map(s=>'<div class="row"><div class="lab">'+s[0]+'<small>'+s[2]+'</small></div><div class="pb wide">'+sbar('Hist.','y26',hist[s[1]],s[0]+' in '+bl+(nY>1?' (yearly average)':'')+': '+n0(hist[s[1]]))+sbar('Needed','y27',need[s[1]],s[0]+' needed for the goal: '+n0(need[s[1]]))+'</div><div class="dcell">'+dl(hist[s[1]],need[s[1]],{pol:0})+'</div></div>').join('');
  const hr=['sp25','sp26','both'].map(k=>{
    const ks=k==='both'?['sp25','sp26']:[k], a=sum(ks.map(x=>H[x].apps)), c=sum(ks.map(x=>H[x].comp)), d=sum(ks.map(x=>H[x].adm)), e=sum(ks.map(x=>H[x].enr));
    return '<tr class="'+(S.tbasis===k?'has-act':'')+'"><td>'+(k==='both'?'Both years':H[k].label)+'</td><td>'+n0(a)+'</td><td>'+n0(c)+'</td><td>'+n0(d)+'</td><td>'+n0(e)+'</td><td>'+p1(d/a)+'</td><td>'+p1(e/d)+'</td><td><span class="v27">'+p1(e/a)+'</span></td><td>'+n0(goal/(e/a))+'</td></tr>';
  }).join('');
  const mxv=Math.max(...target,...mon.map(v=>v/nY));
  const bar=(lab,c,v,tip)=>'<div class="br" title="'+esc(tip)+'"><span class="yr">'+lab+'</span><div class="track"><i class="'+c+'" style="width:'+(nn(v)?(v/mxv*100).toFixed(2):0)+'%"></i></div><span class="val">'+(nn(v)?n0(v):'–')+'</span></div>';
  const rows=K.months.map((m,i)=>{
    const has=i<n, a=has?K.act[i]:null, h=Math.round(mon[i]/nY);
    return '<div class="mrow"><div class="lab">'+m+'<small>'+p1(share[i])+' of term</small></div><div class="pb wide">'+bar('Hist.','t-low',h,m+' in '+bl+': '+n0(h))+bar('Target','t-high',target[i],m+' target: '+n0(target[i]))+bar('Actual','y27',a,m+' actual: '+(has?n0(a):'not yet'))+'</div></div>';
  }).join('');
  let cumT=0,cumA=0;
  const trs=K.months.map((m,i)=>{
    const has=i<n, a=has?K.act[i]:null; cumT+=target[i]; if(has) cumA+=a;
    const pt=has?a/target[i]*100:null, pcum=has?cumA/cumT*100:null;
    return '<tr class="'+(has?'has-act':'')+'"><td>'+m+'</td><td>'+n0(Math.round(mon[i]/nY))+'</td><td>'+n0(target[i])+'</td><td>'+(has?'<span class="v27">'+n0(a)+'</span>':'–')+'</td><td>'+(has?'<span class="'+cls(pt)+'">'+pt.toFixed(1)+'%</span>':'–')+'</td><td>'+n0(cumT)+'</td><td>'+(has?n0(cumA):'–')+'</td><td>'+(has?'<span class="'+cls(pcum)+'">'+pcum.toFixed(1)+'%</span>':'–')+'</td></tr>';
  }).join('');
  const tt=sum(target);
  const foot='<tfoot><tr><td>Full term</td><td>'+n0(Math.round(apps/nY))+'</td><td>'+n0(tt)+'</td><td>'+n0(ytd)+' YTD</td><td><span class="'+cls(pc)+'">'+pc.toFixed(1)+'%</span></td><td>'+n0(tt)+'</td><td>'+n0(ytd)+'</td><td><span class="'+cls(pc)+'">'+pc.toFixed(1)+'%</span></td></tr></tfoot>';
  return insights(ins)+
  '<section class="panel"><div class="ph"><div><h2>Pacing to the enrollment goal</h2><p>Unduplicated transfer applications through 9/30/2026 for Spring 2027 (term 2310).</p></div><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><label for="goal" style="font-size:12.5px;color:var(--muted)">Enrollment goal</label><input id="goal" type="number" min="100" max="9999" step="50" value="'+goal+'" style="font:inherit;width:86px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)"><span style="font-size:12.5px;color:var(--muted)">Based on</span>'+seg('tbasis',[['sp26','Spring 2026'],['sp25','Spring 2025'],['both','Both years']],S.tbasis)+'</div></div>'+cards+'</section>'+
  '<section class="panel"><div class="ph"><div><h2>What it takes to enroll '+n0(goal)+'</h2><p>Working backward from the goal using '+bl+' conversion. Hist. is '+(nY>1?'the yearly average':'the full term')+'.</p></div></div>'+frows+
  '<p class="note">Completed file is shown for reference. Many transfers are admitted before a completed date is recorded, so admits and enrollment are the rates that drive the target.</p></section>'+
  '<section class="panel"><div class="ph"><div><h2>Historical conversion</h2><p>Full-term results. The highlighted row drives the targets above.</p></div></div><div class="tw"><table style="min-width:700px"><thead><tr><th>Term</th><th>Applied</th><th>Completed</th><th>Admitted</th><th>Enrolled</th><th>Admit rate</th><th>Admits enrolling</th><th>Apps enrolling</th><th>Apps for '+n0(goal)+'</th></tr></thead><tbody>'+hr+'</tbody></table></div></section>'+
  '<section class="panel"><div class="ph"><div><h2>Monthly application targets</h2><p>The target spreads the needed '+n0(Math.round(need.apps))+' applications across months the way '+bl+' arrived. Hover a bar for exact values.</p></div></div>'+rows+'</section>'+
  '<section class="panel"><div class="ph"><div><h2>Monthly pacing table</h2><p>Shaded rows have actuals. Green is at or above target, amber is within 3%, red is further behind.</p></div></div><div class="tw"><table style="min-width:720px"><thead><tr><th>Month</th><th>Hist. actual</th><th>Target</th><th>Spring 2027 actual</th><th>% of target</th><th>Cum. target</th><th>Cum. actual</th><th>Cum. % of target</th></tr></thead><tbody>'+trs+'</tbody>'+foot+'</table></div>'+
  '<p class="note">Spring 2025 is term 2250 from the Fall 2025 tab, Spring 2026 is term 2280 from the Fall 2026 tab, and Spring 2027 is term 2310 from the Fall 2027 tab. Enrolled uses the Enrolled? flag. Counts are unduplicated applicants with admit types TR2, TR3, IT1 or IT4, so the Spring 2027 total (1,770) is one below the Overview tab, which counts every application row. Before Aug groups applications dated before 8/1 of the application year.</p></section>';
}
function vKpi(){return D.key==='tr'?vKpiTr():vKpiF();}
function vKpiF(){
  const K=D.kpi, lift=parseFloat(S.lift)/100, sum=a=>a.reduce((x,y)=>x+y,0);
  const low=K.base.slice(), high=K.base.map(v=>Math.round(v*(1+lift)));
  const annLow=sum(low), annHigh=Math.round(annLow*(1+lift)), n=K.act.length;
  const ytd=sum(K.act), tLow=sum(low.slice(0,n)), tHigh=sum(high.slice(0,n));
  const pL=ytd/tLow*100, pH=ytd/tHigh*100, lp=(S.lift)+'%';
  const cls=p=>p>=100?'pct-good':p>=97?'pct-mid':'pct-bad';
  const sg=v=>(v>=0?'+':'−')+n0(Math.abs(v));
  const mnames=K.months.slice(0,n).join(' and ');
  const ins=[
   [pL>=100?'good':'watch',pL>=100?'Applications are running ahead of last year':'Applications are behind last year',n0(ytd)+' applications arrived in '+mnames+', compared with '+n0(tLow)+' last year ('+(pL>=100?'+':'−')+Math.abs(pL-100).toFixed(1)+'%). '+(pH<100?'That is '+n0(tHigh-ytd)+' short of the High target pace of +'+lp+'.':'That is also ahead of the High target pace of +'+lp+'.')],
   ['watch','October decides the year','October was '+(K.base[2]/annLow*100).toFixed(1)+'% of last year’s applications ('+n0(K.base[2])+'). Reaching the High target takes about '+n0(high[2])+' in October, and '+n0(annHigh-ytd)+' more applications overall.'],
   ['ctx','Early pace is a weak predictor','August and September were only '+(tLow/annLow*100).toFixed(1)+'% of last year’s total, so a small gap now can close or widen quickly once October arrives.']
  ];
  const tile=(t,big,cl,sub)=>'<div class="tile"><div class="t">'+t+'</div><div class="big"><b class="'+cl+'">'+big+'</b></div><div class="d">'+sub+'</div></div>';
  const cards='<div class="tiles">'+
   '<div class="tile"><div class="t">Applications, '+K.months[0]+'–'+K.months[n-1]+'</div><div class="big"><b>'+n0(ytd)+'</b></div><div class="d">'+K.months.slice(0,n).map((m,i)=>m+' '+n0(K.act[i])).join(' · ')+'</div></div>'+
   tile('vs. Low target ('+n0(annLow)+')',pL.toFixed(1)+'%',cls(pL),'YTD target: '+n0(tLow)+' · Gap: '+sg(ytd-tLow))+
   tile('vs. High target ('+n0(annHigh)+')',pH.toFixed(1)+'%',cls(pH),'YTD target: '+n0(tHigh)+' · Gap: '+sg(ytd-tHigh))+'</div>';
  const mxv=mx(high);
  const bar=(lab,c,v,tip)=>'<div class="br" title="'+esc(tip)+'"><span class="yr">'+lab+'</span><div class="track"><i class="'+c+'" style="width:'+(nn(v)?(v/mxv*100).toFixed(2):0)+'%"></i></div><span class="val">'+(nn(v)?n0(v):'–')+'</span></div>';
  const rows=K.months.map((m,i)=>{
    const has=i<n, a=has?K.act[i]:null;
    return '<div class="mrow"><div class="lab">'+m+'<small>'+(K.base[i]/annLow*100).toFixed(1)+'% of year</small></div><div class="pb wide">'+bar('Low','t-low',low[i],m+' Low target: '+n0(low[i]))+bar('High','t-high',high[i],m+' High target: '+n0(high[i]))+bar('Actual','y27',a,m+' actual: '+(has?n0(a):'not yet'))+'</div></div>';
  }).join('');
  const trs=K.months.map((m,i)=>{
    const has=i<n, a=has?K.act[i]:null;
    const pl=has?a/low[i]*100:null, ph=has?a/high[i]*100:null;
    return '<tr class="'+(has?'has-act':'')+'"><td>'+m+'</td><td>'+n0(K.base[i])+'</td><td>'+n0(low[i])+'</td><td>'+n0(high[i])+'</td><td>'+(has?'<span class="v27">'+n0(a)+'</span>':'–')+'</td><td>'+(has?'<span class="'+cls(pl)+'">'+pl.toFixed(1)+'%</span>':'–')+'</td><td>'+(has?'<span class="'+cls(ph)+'">'+ph.toFixed(1)+'%</span>':'–')+'</td></tr>';
  }).join('');
  const foot='<tfoot><tr><td>Full year</td><td>'+n0(annLow)+'</td><td>'+n0(annLow)+'</td><td>'+n0(annHigh)+'</td><td>'+n0(ytd)+' YTD</td><td><span class="'+cls(pL)+'">'+pL.toFixed(1)+'%</span></td><td><span class="'+cls(pH)+'">'+pH.toFixed(1)+'%</span></td></tr></tfoot>';
  return insights(ins)+
  '<section class="panel"><div class="ph"><div><h2>Year-to-date pacing</h2><p>Unduplicated FTIC applications, 8/1 through 9/30, against last year’s monthly volume.</p></div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:12.5px;color:var(--muted)">High target growth</span>'+seg('lift',[['1','+1%'],['2','+2%'],['3','+3%']],S.lift)+'</div></div>'+cards+'</section>'+
  '<section class="panel"><div class="ph"><div><h2>Monthly targets</h2><p>Low target repeats '+K.baseYr+' volume. High target adds '+lp+'. Hover a bar for exact values.</p></div></div>'+rows+'</section>'+
  '<section class="panel"><div class="ph"><div><h2>Monthly pacing table</h2><p>Shaded rows have actuals. Green is at or above target, amber is within 3% of target, red is further behind.</p></div></div><div class="tw"><table style="min-width:640px"><thead><tr><th>Month</th><th>'+K.baseYr+' actual</th><th>Low target</th><th>High target</th><th>'+K.actYr+' actual</th><th>% of Low</th><th>% of High</th></tr></thead><tbody>'+trs+'</tbody>'+foot+'</table></div>'+
  '<p class="note">'+K.baseYr+' is Fall 2026 term 2300 applications from 8/1/2025 to 7/31/2026. '+K.actYr+' actuals are Fall 2027 term 2330 applications through 9/30/2026. Counts are unduplicated applicants with admit types EX, FR2, FR3, IF1 or IF4. The enrollment goal behind these targets is 7,500 freshmen.</p></section>';
}

const V={overview:vOverview,programs:vPrograms,speed:vSpeed,profile:vProfile,denials:vDenials,kpis:vKpi};
function setHash(){try{history.replaceState(null,'','#'+D.hash+S.tab)}catch(_){}}
function render(){
  D=DS[S.aud];
  if(D.tabs.indexOf(S.tab)<0) S.tab='overview';
  const a=document.activeElement; let key=null;
  if(a&&a.dataset){
    if(a.dataset.set) key='[data-set="'+a.dataset.set+'"][data-v="'+a.dataset.v+'"]';
    else if(a.dataset.tk) key='[data-tk="'+a.dataset.tk+'"]';
    else if(a.dataset.sel) key='[data-sel="'+a.dataset.sel+'"]';
    else if(a.dataset.tab) key='[data-tab="'+a.dataset.tab+'"]';
  }
  if(!key&&a&&a.id==='goal') key='#goal';
  document.getElementById('h1').textContent=D.h1;
  document.getElementById('sub').textContent=D.sub;
  document.getElementById('aud').innerHTML=seg('aud',[['ftic','Fall FTIC'],['tr','Spring Transfers']],S.aud);
  document.getElementById('chips').innerHTML=D.chips.map(c=>'<span class="chip '+c[0]+'"><i></i>'+c[1]+'</span>').join('');
  document.getElementById('foot').textContent=D.foot;
  document.getElementById('tabs').innerHTML=TABS.filter(t=>D.tabs.indexOf(t[0])>=0).map(t=>'<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+'</button>').join('');
  document.getElementById('view').innerHTML=V[S.tab]();
  if(key){const el=document.querySelector(key); if(el) el.focus({preventScroll:true});}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'),s=e.target.closest('[data-set]'),k=e.target.closest('[data-tk]'),r=e.target.closest('[data-sel]');
  if(t){S.tab=t.dataset.tab;setHash();render();window.scrollTo({top:0})}
  else if(s){
    if(s.dataset.set==='aud'){S.aud=s.dataset.v;S.sel=DS[S.aud].defSel;D=DS[S.aud];setHash();}
    else S[s.dataset.set]=s.dataset.v;
    render();
  }
  else if(k){const v=k.dataset.tk;if(S.tk===v)S.td*=-1;else{S.tk=v;S.td=(v==='days')?1:-1}render()}
  else if(r){S.sel=r.dataset.sel;render()}
});
document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='goal'){S.goal=Math.min(9999,Math.max(100,parseInt(e.target.value,10)||2000));render();}
});
document.addEventListener('keydown',e=>{
  const r=e.target.closest&&e.target.closest('[data-sel]');
  if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();S.sel=r.dataset.sel;render()}
});
(function(){
  let h=(location.hash||'').slice(1);
  if(h.indexOf('tr-')===0){S.aud='tr';S.sel=TRN.defSel;h=h.slice(3)}
  if(V[h])S.tab=h;
  render();
})();
</script>
